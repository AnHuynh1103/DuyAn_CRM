version: "3.9"

services:
  odoo:
    # Chage Odoo version image:
    #   image: novobidevops/odoo:[odoo_version]
    # Available [odoo_version]: 10, 11, 12, 13, 14, 15

    image: odoo-crm:16

    ports:
      - "8069:8069"
    volumes:
      - ./:/opt/odoo
      - odoo_data:/home/odoo/.local/share/Odoo
    command: bash -c "$${PYTHON_PATH} $${START_ODOO} $${ODOO_PARAM} && tail -f /dev/null"
    environment:
      PYTHON_PATH: "/usr/bin/python3"
      START_ODOO: "/opt/odoo/odoo/odoo-bin -c /opt/odoo/odoo.conf"
      ODOO_PARAM: "" 
      #"--no-database-list"
      
    depends_on:
      - nginx
      - postgres
    restart: unless-stopped
    tty: true

  nginx:
    image: nginx


    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./box/odoo_nginx.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    restart: unless-stopped
    tty: true

  postgres:
    image: postgres:14-bullseye
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    tty: true


volumes:
  odoo_data:
  postgres_data: