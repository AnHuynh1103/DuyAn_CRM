# ================== UPSTREAMS ==================
upstream odoo_upstream        { server odoo:8069; }   # Odoo HTTP
upstream odoo_upstream_poll   { server odoo:8072; }   # Odoo longpolling
upstream n8n_upstream         { server n8n:5678; }    # n8n

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ================== HTTP :80 (ACME + redirect) ==================
# CRM (Odoo)
server {
    listen 80;
    server_name crm.duyan.vn;

    # ACME challenge phải trỏ đúng webroot đã mount vào container
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # mọi request khác chuyển HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# N8N
server {
    listen 80;
    server_name n8n.tuankiet.media;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ================== HTTPS :443 ==================
# CRM (Odoo)
server {
    listen 443 ssl http2;
    server_name crm.duyan.vn;
    client_max_body_size 1000m;

    ssl_certificate     /etc/letsencrypt/live/crm.duyan.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.duyan.vn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_tokens off;

    # Odoo web
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 480;
        proxy_connect_timeout 300;
        proxy_redirect off;
        proxy_pass http://odoo_upstream;
    }

    # Bus / longpolling
    location /longpolling {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://odoo_upstream_poll;
    }

    # health
    location /nginx_status {
        stub_status;
        access_log off;
        allow all;
    }
}

# N8N
server {
    listen 443 ssl http2;
    server_name n8n.tuankiet.media;

    ssl_certificate     /etc/letsencrypt/live/n8n.tuankiet.media/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/n8n.tuankiet.media/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_pass http://n8n_upstream;
    }
}

# Chặn request vớ vẩn tới IP
server {
    listen 80 default_server;
    return 404;
}
