[options]
; ==================== DATABASE ====================
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
; Comment db_name để cho phép tạo và truy cập nhiều database
db_name = production_crm
; Cho phép tạo database từ web interface
;db_filter = .*
db_maxconn = 64

; ==================== SERVER ====================
xmlrpc_port = 8069
longpolling_port = 8072
workers = 4
max_cron_threads = 2
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_request = 8192
limit_time_cpu = 600
limit_time_real = 1200
limit_time_real_cron = 0

; ==================== ADDONS ====================
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons

; ==================== LOGGING ====================
log_level = info
log_handler = :INFO
log_db = False
log_db_level = warning

; ==================== SESSION ====================
proxy_mode = True

; ==================== EMAIL ====================
email_from = admin@duyan.vn
smtp_server = smtp.gmail.com
smtp_port = 587
smtp_ssl = False
smtp_user = your-email@gmail.com
smtp_password = your-app-password

; ==================== SECURITY ====================
admin_passwd = admin-master-password
list_db = False
; Cho phép tạo database từ web interface
dbfilter = False

; ==================== DATA ====================
data_dir = /var/lib/odoo