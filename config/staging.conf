[options]
; ==================== DATABASE ====================
db_host = db-staging
db_port = 5432
db_user = odoo_staging
db_password = odoo_staging
db_name = False
db_maxconn = 32

; ==================== SERVER ====================
xmlrpc_port = 8069
longpolling_port = 8072
workers = 2
max_cron_threads = 1
limit_memory_hard = 1073741824
limit_memory_soft = 805306368
limit_request = 8192
limit_time_cpu = 300
limit_time_real = 600
limit_time_real_cron = 0

; ==================== ADDONS ====================
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons

; ==================== LOGGING ====================
log_level = debug
log_handler = :DEBUG
log_db = True
log_db_level = info

; ==================== SESSION ====================
proxy_mode = True

; ==================== EMAIL ====================
email_from = staging@duyan.vn
smtp_server = smtp.gmail.com
smtp_port = 587
smtp_ssl = False
smtp_user = staging-email@gmail.com
smtp_password = staging-app-password

; ==================== SECURITY ====================
admin_passwd = staging-master-password
list_db = True

; ==================== DATA ====================
data_dir = /var/lib/odoo

; ==================== DEVELOPMENT ====================
#dev_mode = reload,xml
without_demo = False
