
services:
  odoo:
    # Chage Odoo version image:
    #   image: novobidevops/odoo:[odoo_version]
    # Available [odoo_version]: 10, 11, 12, 13, 14, 15

    image: crm-odoo:18
    # build: ./box

    # If developer want to use their own Docker environment, Do the following actions : 
    #
    # + comment line #9 
    # + uncomment line #10. 
    # + Make adjustment on file ./box/Dockerfile
    #
    # After docker-compose up, a new docker image will be built 
    # with the new adjustments on the file ./box/Dockerfile

    ports:
      - "8069:8069"
    volumes:
      - ./:/opt/odoo
      - odoo_data:/var/lib/odoo
    command: bash -c "$${PYTHON_PATH} $${START_ODOO} $${ODOO_PARAM} && tail -f /dev/null"
    environment:
      PYTHON_PATH: "/usr/bin/python3"
      START_ODOO: "/opt/odoo/odoo18/odoo-bin -c /opt/odoo/odoo18.conf"
      ODOO_PARAM: "" 
      #"--no-database-list"
      
    depends_on:
      - nginx
      - postgres
    restart: unless-stopped
    tty: true
  nginx:
    image: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./box18/odoo_nginx.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    restart: unless-stopped
    tty: true
  postgres:
    image: postgres:14-bullseye
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    tty: true
  n8n:
    image: n8nio/n8n
    ports:
      - "5678:5678"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=postgres
      - DB_POSTGRESDB_USER=odoo
      - DB_POSTGRESDB_PASSWORD=odoo
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=admin123
      - N8N_HOST=n8n.tuankiet.media
      - WEBHOOK_URL=https://n8n.tuankiet.media/
      - N8N_PROTOCOL=https
      - N8N_PORT=5678
      - N8N_SECURE_COOKIE=false
    depends_on:
      - postgres
    restart: unless-stopped
    volumes:
      - n8n_data:/home/node/.n8n
    tty: true
volumes:
  odoo_data:
  postgres_data:
  n8n_data: